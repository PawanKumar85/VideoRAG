[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videorag"
version = "0.1.0"
description = "VideoRAG: Timestamped video search with hybrid retrieval (dense + BM25 + RRF) and grounded, cited answers"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "scrapy>=2.19.0",
    "tokenizers>=0.19.0",
    "faster-whisper>=1.2.0",
    "pandas>=2.3.3",
    "pypdf>=6.19.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers"]
whisper = ["faster-whisper"]
llm = ["anthropic", "groq", "openai", "huggingface-hub"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["vidsearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
